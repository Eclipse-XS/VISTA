validation:
  expected_rgb_channels: 3
  expected_xyz_channels: 3
  min_valid_3d_ratio_warn: 0.25
  min_valid_3d_ratio_fail: 0.01
  zero_depth_epsilon: 1.0e-6
  max_abs_coordinate: 100.0
  detect_near_duplicates: true
  near_duplicate_dhash_distance: 2

preprocessing:
  version: "silver_v1"
  depth_unit: "meters"
  zero_depth_epsilon: 1.0e-6
  compute_normals: true
  normal_min_valid_neighbor_ratio: 0.10
  normal_max_step_meters: 0.05
  save_depth_preview_png: true
  save_normal_preview_png: true
  batch_size: 32
  cleanup_local_bronze_after_silver: false

quality:
  underexposed_threshold: 15
  overexposed_threshold: 240
  outlier_robust_z_threshold: 3.5

cache:
  max_local_cache_gb: 6.0
  min_free_disk_gb: 2.0
