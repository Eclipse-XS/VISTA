name: VISTA Data Engineering CI

on:
  push:
    branches: ["main", "harden/**"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install VISTA and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Static lint check (Ruff)
        run: ruff check src tests scripts

      - name: Repository secret & large-artifact hygiene check
        run: python scripts/check_repo_hygiene.py

      - name: Run unit, offline integration, and dbt fixture tests (no live credentials)
        run: pytest -m "not live" -v
