[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vista-de"
version = "0.1.0"
description = "VISTA Data Engineering platform for multimodal RGB + 3D industrial anomaly detection (MVTec 3D-AD)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "numpy>=1.26",
    "pyarrow>=17.0",
    "opencv-python-headless>=4.10",
    "tifffile>=2024.5",
    "pillow>=10.4",
    "duckdb>=1.1",
    "dbt-duckdb>=1.8",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "structlog>=24.4",
    "matplotlib>=3.9",
    "scipy>=1.13",
    "prefect>=3.0",
    "mlflow-skinny>=2.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[project.scripts]
vista = "vista.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["vista*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "live: integration tests requiring live external services (Google Drive / network)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
