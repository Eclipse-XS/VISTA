[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vista-de"
version = "0.1.0"
description = "VISTA Data Engineering platform for multimodal RGB + 3D industrial anomaly detection (MVTec 3D-AD)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "numpy>=1.26",
    "pyarrow>=17.0",
    "opencv-python-headless>=4.10",
    "tifffile>=2024.5",
    "pillow>=10.4",
    "duckdb>=1.1",
    "dbt-duckdb>=1.8",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "structlog>=24.4",
    "matplotlib>=3.9",
    "scipy>=1.13",
    "prefect>=3.0",
    "mlflow-skinny>=3.0,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]
ml = [
    "torch>=2.4",
]

[project.scripts]
vista = "vista.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["vista*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "live: integration tests requiring live external services (Google Drive / network)",
    "postgres: integration tests requiring a live PostgreSQL instance (VISTA_REQUIRE_POSTGRES=1 fails instead of skipping)",
    "s3_compat: integration tests requiring rclone for local S3-compatible REST API verification (VISTA_REQUIRE_S3_RCLONE=1 fails instead of skipping)",
    "ml_loader: integration tests requiring PyTorch DataLoader multiworker verification (VISTA_REQUIRE_TORCH=1 fails instead of skipping)",
    "mlflow_server: integration tests requiring a live MLflow HTTP tracking server (VISTA_REQUIRE_MLFLOW_SERVER=1 fails instead of skipping)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
