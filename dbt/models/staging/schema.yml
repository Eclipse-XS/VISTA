version: 2

models:
  - name: stg_categories
    description: "Staged MVTec 3D-AD dataset categories from committed Gold snapshot."
    columns:
      - name: category_name
        tests: [unique, not_null]
  - name: stg_samples
    description: "Staged multimodal samples indexed from Bronze archives."
    columns:
      - name: sample_pk
        tests: [unique, not_null]
      - name: sample_key
        tests: [unique, not_null]
      - name: split
        tests:
          - not_null
          - accepted_values:
              values: ["train", "validation", "test"]
  - name: stg_validation_results
    description: "Staged per-sample multimodal validation outcomes."
    columns:
      - name: validation_id
        tests: [unique, not_null]
      - name: validation_status
        tests:
          - not_null
          - accepted_values:
              values: ["PASS", "WARN", "QUARANTINE", "FAIL"]
  - name: stg_quality_metrics
    description: "Staged raw global & foreground-aware RGB/3D sample quality metrics."
    columns:
      - name: metric_id
        tests: [unique, not_null]
  - name: stg_normalization_artifacts
    description: "Staged frozen train-only normalization parameter artifacts."
    columns:
      - name: norm_artifact_id
        tests: [unique, not_null]
      - name: artifact_key
        tests: [unique, not_null]
      - name: train_manifest_hash
        tests: [not_null]
      - name: params_sha256
        tests: [not_null]
  - name: stg_ml_normalized_features
    description: "Staged ML-safe features normalized strictly with frozen train-only parameters."
    columns:
      - name: norm_feature_id
        tests: [unique, not_null]
      - name: norm_artifact_id
        tests: [not_null]
  - name: stg_stage_runs
    description: "Staged operational stage run attempts with retry metadata."
    columns:
      - name: stage_run_id
        tests: [unique, not_null]
      - name: stage_status
        tests:
          - not_null
          - accepted_values:
              values: ["RUNNING", "SUCCEEDED", "FAILED", "INTERRUPTED", "SKIPPED"]
  - name: stg_silver_artifacts
    description: "Staged Silver derived geometric artifacts (depth, normals, valid mask)."
    columns:
      - name: artifact_id
        tests: [unique, not_null]
  - name: stg_artifact_lineage
    description: "Staged Bronze-to-Silver lineage edges."
    columns:
      - name: lineage_id
        tests: [unique, not_null]
