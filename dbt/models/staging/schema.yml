version: 2

models:
  - name: stg_categories
    description: "Staged MVTec 3D-AD dataset categories from Gold Parquet."
    columns:
      - name: category_name
        tests: [unique, not_null]
  - name: stg_samples
    description: "Staged multimodal samples indexed from Bronze archives."
    columns:
      - name: sample_pk
        tests: [unique, not_null]
      - name: sample_key
        tests: [unique, not_null]
      - name: split
        tests:
          - not_null
          - accepted_values:
              values: ["train", "validation", "test"]
  - name: stg_validation_results
    description: "Staged per-sample multimodal validation outcomes."
    columns:
      - name: validation_id
        tests: [unique, not_null]
      - name: validation_status
        tests:
          - not_null
          - accepted_values:
              values: ["PASS", "WARN", "QUARANTINE", "FAIL"]
  - name: stg_quality_metrics
    description: "Staged RGB and 3D sample quality metrics."
    columns:
      - name: metric_id
        tests: [unique, not_null]
  - name: stg_silver_artifacts
    description: "Staged Silver derived geometric artifacts (depth, normals, valid mask)."
    columns:
      - name: artifact_id
        tests: [unique, not_null]
  - name: stg_artifact_lineage
    description: "Staged Bronze-to-Silver lineage edges."
    columns:
      - name: lineage_id
        tests: [unique, not_null]
